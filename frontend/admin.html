<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Administration | Inclusive ATS</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script src="env.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="drawer-backdrop" class="drawer-backdrop"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar__brand">
        <a href="index.html" class="sidebar__brand-link">
          <div class="sidebar__logo-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"/></svg>
          </div>
          <span class="sidebar__brand-text">Inclusive ATS</span>
        </a>
      </div>

      <nav id="sidebar-nav" class="sidebar__nav" aria-label="Main Navigation"></nav>

      <div class="sidebar__footer">
        <button id="logout-btn" class="sidebar__link" style="border: none; background: transparent; width: 100%; cursor: pointer;" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar__left">
          <button id="mobile-menu-toggle" class="icon-btn topbar__mobile-toggle" aria-label="Open navigation menu" aria-expanded="false" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div id="breadcrumbs"></div>
        </div>
        <div class="topbar__right">
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" type="button"></button>
          <div class="user-pill">
            <div class="user-pill__avatar" style="background: linear-gradient(135deg, var(--color-danger), #b91c1c);">A</div>
            <span id="topbar-user-name" class="user-pill__name">Administrator</span>
          </div>
        </div>
      </header>

      <main class="page-container">
        <div class="page-header">
          <div class="page-header__content">
            <h1 class="page-header__title">System Administration</h1>
            <p class="page-header__subtitle">Platform health diagnostics, user account moderation, and security audit logs</p>
          </div>
          <div class="page-header__actions">
            <a href="fairness.html" class="btn btn--ai btn--sm">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 7h14M5 7l-3 7a4 4 0 0 0 6 0zM19 7l-3 7a4 4 0 0 0 6 0zM8 21h8"/></svg>
              SDG 10 Fairness Center
            </a>
          </div>
        </div>

        <!-- Overview Metrics Grid -->
        <div id="admin-metrics-container" class="grid grid--stats" style="margin-bottom: var(--space-6);"></div>

        <!-- System Diagnostics Panel -->
        <div id="system-health-container" style="margin-bottom: var(--space-6);"></div>

        <!-- User Accounts Management Section -->
        <div class="card" style="margin-bottom: var(--space-6);" id="users">
          <div class="card__header">
            <h3 class="card__title">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
              Registered Users & Permissions
            </h3>
          </div>
          <div id="users-table-container"></div>
        </div>

        <!-- Security Audit Logs Section -->
        <div class="card">
          <div class="card__header">
            <h3 class="card__title">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"/></svg>
              Recent Security Audit Events
            </h3>
          </div>
          <div id="audit-logs-container"></div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/pages/admin.js"></script>
</body>
</html>
