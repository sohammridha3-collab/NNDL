<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Inclusive Resume & Job Matching</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script src="env.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-card__header">
        <a href="index.html" class="auth-card__logo" aria-label="Inclusive ATS Home">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"/></svg>
        </a>
        <h1 class="auth-card__title">Sign In</h1>
        <p class="auth-card__subtitle">Access your inclusive recruitment dashboard</p>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label class="field__label" for="login-email">Email Address</label>
          <input class="input" type="email" id="login-email" name="email" required autocomplete="email" placeholder="name@domain.com">
        </div>

        <div class="field">
          <div class="field__label">
            <label for="login-password">Password</label>
          </div>
          <div class="input-group">
            <input class="input" type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••">
            <div class="input-group__trailing">
              <button type="button" class="icon-btn password-toggle" aria-label="Show password">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); font-size: var(--font-size-sm);">
          <label style="display: flex; align-items: center; gap: var(--space-2); cursor: pointer; color: var(--text-secondary);">
            <input type="checkbox" name="remember" id="login-remember">
            <span>Keep me signed in</span>
          </label>
        </div>

        <button id="login-submit" type="submit" class="btn btn--primary btn--block">Sign In</button>
      </form>

      <!-- Pre-seeded accounts guidance -->
      <div style="margin-top: var(--space-6); padding: var(--space-3); background: var(--bg-subtle); border-radius: var(--radius-lg); font-size: var(--font-size-xs); color: var(--text-muted);">
        <strong style="display: block; color: var(--text-secondary); margin-bottom: 2px;">Demo Test Credentials:</strong>
        <div>Candidate: <code>candidate@example.com</code> / <code>Candidate@12345</code></div>
        <div>Recruiter: <code>recruiter@techinnovate.com</code> / <code>Recruiter@12345</code></div>
        <div>Admin: <code>admin@inclusiveats.org</code> / <code>Admin@12345</code></div>
      </div>

      <div class="auth-card__footer">
        Don't have an account yet? <a href="register.html">Create an account</a>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
