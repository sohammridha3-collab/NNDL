<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Dashboard | Inclusive ATS</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script src="env.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- Mobile Drawer Backdrop -->
    <div id="drawer-backdrop" class="drawer-backdrop"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar__brand">
        <a href="index.html" class="sidebar__brand-link">
          <div class="sidebar__logo-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"/></svg>
          </div>
          <span class="sidebar__brand-text">Inclusive ATS</span>
        </a>
      </div>

      <nav id="sidebar-nav" class="sidebar__nav" aria-label="Main Navigation"></nav>

      <div class="sidebar__footer">
        <button id="logout-btn" class="sidebar__link" style="border: none; background: transparent; width: 100%; cursor: pointer;" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">
      <header class="topbar">
        <div class="topbar__left">
          <button id="mobile-menu-toggle" class="icon-btn topbar__mobile-toggle" aria-label="Open navigation menu" aria-expanded="false" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div id="breadcrumbs"></div>
        </div>
        <div class="topbar__right">
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" type="button"></button>
          <div class="user-pill">
            <div class="user-pill__avatar">C</div>
            <span id="topbar-user-name" class="user-pill__name">Candidate</span>
          </div>
        </div>
      </header>

      <main class="page-container">
        <div class="page-header">
          <div class="page-header__content">
            <h1 class="page-header__title">Candidate Workspace</h1>
            <p class="page-header__subtitle">Manage your profile, track application stages, and discover AI-matched jobs</p>
          </div>
          <div class="page-header__actions">
            <a href="resumes.html" class="btn btn--secondary btn--sm">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
              Upload Resume
            </a>
            <a href="match.html" class="btn btn--ai btn--sm">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
              Live Matcher
            </a>
          </div>
        </div>

        <div id="dashboard-content"></div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/pages/dashboard.js"></script>
</body>
</html>
