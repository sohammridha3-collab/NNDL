<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs | Inclusive ATS</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script src="env.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="drawer-backdrop" class="drawer-backdrop"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar__brand">
        <a href="index.html" class="sidebar__brand-link">
          <div class="sidebar__logo-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"/></svg>
          </div>
          <span class="sidebar__brand-text">Inclusive ATS</span>
        </a>
      </div>

      <nav id="sidebar-nav" class="sidebar__nav" aria-label="Main Navigation"></nav>

      <div class="sidebar__footer">
        <button id="logout-btn" class="sidebar__link" style="border: none; background: transparent; width: 100%; cursor: pointer;" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar__left">
          <button id="mobile-menu-toggle" class="icon-btn topbar__mobile-toggle" aria-label="Open navigation menu" aria-expanded="false" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div id="breadcrumbs"></div>
        </div>
        <div class="topbar__right">
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" type="button"></button>
          <div class="user-pill">
            <div class="user-pill__avatar">U</div>
            <span id="topbar-user-name" class="user-pill__name">User</span>
          </div>
        </div>
      </header>

      <main class="page-container">
        <div class="page-header">
          <div class="page-header__content">
            <h1 class="page-header__title">Job Opportunities</h1>
            <p class="page-header__subtitle">Discover verified technical roles evaluated with fair, merit-based matching</p>
          </div>
        </div>

        <!-- Search & Filter Controls -->
        <div class="card" style="margin-bottom: var(--space-6); padding: var(--space-4);">
          <div class="grid grid--cols-4" style="gap: var(--space-3);">
            <div class="field" style="margin-bottom: 0;">
              <label class="field__label" for="job-search-input">Search Keywords</label>
              <input class="input" type="search" id="job-search-input" placeholder="Title, skills, or description…">
            </div>

            <div class="field" style="margin-bottom: 0;">
              <label class="field__label" for="job-category-select">Job Category</label>
              <select class="select" id="job-category-select">
                <option value="">All Categories</option>
                <option value="INFORMATION-TECHNOLOGY">Information Technology</option>
                <option value="FINANCE">Finance</option>
                <option value="HR">Human Resources</option>
                <option value="BUSINESS-DEVELOPMENT">Business Development</option>
                <option value="SALES">Sales</option>
                <option value="Software">Software & Engineering</option>
                <option value="Data">Data & AI</option>
                <option value="Cloud">Cloud & DevOps</option>
              </select>
            </div>

            <div class="field" style="margin-bottom: 0;">
              <label class="field__label" for="job-type-select">Work Arrangement</label>
              <select class="select" id="job-type-select">
                <option value="">Any Arrangement</option>
                <option value="remote">Remote</option>
                <option value="hybrid">Hybrid</option>
                <option value="on-site">On-Site</option>
              </select>
            </div>

            <div class="field" style="margin-bottom: 0;">
              <label class="field__label" for="job-sort-select">Sort By</label>
              <select class="select" id="job-sort-select">
                <option value="newest" selected>Newest Postings</option>
                <option value="oldest">Oldest</option>
                <option value="title">Title (A-Z)</option>
              </select>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-subtle);">
            <div id="filter-status-text" style="font-size: var(--font-size-xs); color: var(--text-muted);">
              Showing available jobs
            </div>
            <button type="button" id="clear-filters-btn" class="btn btn--ghost btn--sm" style="display: none;">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
              <span>Clear Filters</span>
            </button>
          </div>
        </div>

        <!-- Jobs Grid Container -->
        <div id="jobs-grid-container"></div>

        <!-- Jobs Pagination Container -->
        <div id="jobs-pagination-container"></div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/pages/jobs.js"></script>
</body>
</html>
