<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Match Engine | Inclusive ATS</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script src="env.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="drawer-backdrop" class="drawer-backdrop"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar__brand">
        <a href="index.html" class="sidebar__brand-link">
          <div class="sidebar__logo-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"/></svg>
          </div>
          <span class="sidebar__brand-text">Inclusive ATS</span>
        </a>
      </div>

      <nav id="sidebar-nav" class="sidebar__nav" aria-label="Main Navigation"></nav>

      <div class="sidebar__footer">
        <button id="logout-btn" class="sidebar__link" style="border: none; background: transparent; width: 100%; cursor: pointer;" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar__left">
          <button id="mobile-menu-toggle" class="icon-btn topbar__mobile-toggle" aria-label="Open navigation menu" aria-expanded="false" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div id="breadcrumbs"></div>
        </div>
        <div class="topbar__right">
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" type="button"></button>
          <div class="user-pill">
            <div class="user-pill__avatar" style="background: linear-gradient(135deg, var(--color-ai), #4f46e5);">AI</div>
            <span id="topbar-user-name" class="user-pill__name">User</span>
          </div>
        </div>
      </header>

      <main class="page-container">
        <div class="page-header">
          <div class="page-header__content">
            <h1 class="page-header__title">AI Match Engine</h1>
            <p class="page-header__subtitle">Real PyTorch inference with 770-dimensional feature scaling and SDG 10 demographic blindfolding</p>
          </div>
          <div class="page-header__actions" style="display: flex; gap: var(--space-2);">
            <a href="applications.html" class="btn btn--secondary btn--sm">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
              Match History
            </a>
            <button id="load-sample-btn" type="button" class="btn btn--secondary btn--sm">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
              Load Sample Pair
            </button>
          </div>
        </div>

        <form id="match-form" action="javascript:void(0);" onsubmit="return false;" novalidate>
          <div class="match-layout" style="margin-bottom: var(--space-6);">
            <!-- Left Column: Resume Input -->
            <div class="card">
              <div class="card__header">
                <h3 class="card__title">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/></svg>
                  Candidate Resume
                </h3>
                <span class="field__hint">Stored or Direct Input</span>
              </div>

              <div class="field">
                <label class="field__label" for="match-resume-select">Select Stored Resume</label>
                <select class="select" id="match-resume-select">
                  <option value="">— Loading resumes… —</option>
                </select>
              </div>

              <div style="text-align: center; margin: var(--space-2) 0; color: var(--text-muted); font-size: var(--font-size-xs); text-transform: uppercase;">
                — or paste raw text —
              </div>

              <div class="field" style="margin-bottom: 0;">
                <label class="field__label" for="match-resume-text">Paste Resume Text</label>
                <textarea class="textarea" id="match-resume-text" rows="8" placeholder="Paste full resume content, work experience, education, and technical competencies…"></textarea>
              </div>
            </div>

            <!-- Right Column: Job Input -->
            <div class="card">
              <div class="card__header">
                <h3 class="card__title">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h18v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM8 8V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3M3 13h18"/></svg>
                  Target Job Opening
                </h3>
                <span class="field__hint">Posted or Direct Input</span>
              </div>

              <div class="field">
                <label class="field__label" for="match-job-select">Select Posted Job</label>
                <select class="select" id="match-job-select">
                  <option value="">— Loading jobs… —</option>
                </select>
              </div>

              <div style="text-align: center; margin: var(--space-2) 0; color: var(--text-muted); font-size: var(--font-size-xs); text-transform: uppercase;">
                — or paste job description —
              </div>

              <div class="field" style="margin-bottom: 0;">
                <label class="field__label" for="match-job-text">Paste Job Description</label>
                <textarea class="textarea" id="match-job-text" rows="8" placeholder="Paste role title, responsibilities, required qualifications, and core skill keywords…"></textarea>
              </div>
            </div>
          </div>

          <div style="display: flex; justify-content: center; margin-bottom: var(--space-8);">
            <button id="analyze-match-btn" type="button" class="btn btn--ai btn--lg" style="min-width: 260px;">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
              Analyze Match Compatibility
            </button>
          </div>
        </form>

        <!-- Dynamic Results Section -->
        <div id="match-results-container"></div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/pages/match.js"></script>
</body>
</html>
